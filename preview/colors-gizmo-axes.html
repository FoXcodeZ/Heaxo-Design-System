<!doctype html>
<!-- @dsCard group="Colors" name="Gizmo axes" subtitle="X/Y/Z canonical 3D axis colors" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Gizmo axes</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div style="display:flex; gap:24px; align-items:center; padding: 8px 0;">
    
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="64" height="48" viewBox="0 0 64 48" fill="none">
          <line x1="8" y1="40" x2="56" y2="40" stroke="#e0566c" stroke-width="2"/>
          <polygon points="56,40 50,36 50,44" fill="#e0566c"/>
          <circle cx="8" cy="40" r="3" fill="#e0566c"/>
          <text x="60" y="32" fill="#e0566c" font-family="JetBrains Mono" font-size="14" font-weight="700">X</text>
        </svg>
        <div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); letter-spacing:0.05em;">--axis-x</div>
          <div style="font-family:var(--font-mono); font-size:11px; color:#e0566c;">#e0566c</div>
        </div>
      </div>
    
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="64" height="48" viewBox="0 0 64 48" fill="none">
          <line x1="8" y1="40" x2="56" y2="40" stroke="#b6e34d" stroke-width="2"/>
          <polygon points="56,40 50,36 50,44" fill="#b6e34d"/>
          <circle cx="8" cy="40" r="3" fill="#b6e34d"/>
          <text x="60" y="32" fill="#b6e34d" font-family="JetBrains Mono" font-size="14" font-weight="700">Y</text>
        </svg>
        <div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); letter-spacing:0.05em;">--axis-y</div>
          <div style="font-family:var(--font-mono); font-size:11px; color:#b6e34d;">#b6e34d</div>
        </div>
      </div>
    
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="64" height="48" viewBox="0 0 64 48" fill="none">
          <line x1="8" y1="40" x2="56" y2="40" stroke="#5aa9ff" stroke-width="2"/>
          <polygon points="56,40 50,36 50,44" fill="#5aa9ff"/>
          <circle cx="8" cy="40" r="3" fill="#5aa9ff"/>
          <text x="60" y="32" fill="#5aa9ff" font-family="JetBrains Mono" font-size="14" font-weight="700">Z</text>
        </svg>
        <div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); letter-spacing:0.05em;">--axis-z</div>
          <div style="font-family:var(--font-mono); font-size:11px; color:#5aa9ff;">#5aa9ff</div>
        </div>
      </div>
    
  </div>
  <div style="font-size:11px; color:var(--fg-3); border-top:1px solid var(--stroke-1); padding-top:10px;">Canonical 3D editor axis colors — never recolor.</div>
</div></body></html>
