<!doctype html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Lucide at 1.75 stroke" viewport="700x150" -->
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_card.css">
</head><body><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>window.addEventListener("load",()=>lucide.createIcons());</script>
<style>
.icon-grid { display:grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
.icon-grid > div { display:flex; align-items:center; justify-content:center; height:36px; background: var(--bg-2); border:1px solid var(--stroke-1); border-radius:6px; color: var(--fg-2); }
.icon-grid [data-lucide]{ width:16px; height:16px; stroke-width: 1.75; }
</style>
<div class="card">
  <div class="icon-grid">
    <div><i data-lucide="box"></i></div><div><i data-lucide="layers"></i></div><div><i data-lucide="move-3d"></i></div><div><i data-lucide="rotate-3d"></i></div><div><i data-lucide="scale"></i></div><div><i data-lucide="grid-3x3"></i></div><div><i data-lucide="sun"></i></div><div><i data-lucide="video"></i></div><div><i data-lucide="mountain"></i></div><div><i data-lucide="user"></i></div><div><i data-lucide="play"></i></div><div><i data-lucide="pause"></i></div><div><i data-lucide="square"></i></div><div><i data-lucide="save"></i></div><div><i data-lucide="folder-open"></i></div><div><i data-lucide="file-plus"></i></div><div><i data-lucide="search"></i></div><div><i data-lucide="settings"></i></div><div><i data-lucide="terminal"></i></div><div><i data-lucide="cpu"></i></div>
  </div>
  <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); letter-spacing:0.05em;">LUCIDE · 1.75 STROKE · 14–16PX IN CHROME · 20–24PX IN MARKETING</div>
</div></body></html>
