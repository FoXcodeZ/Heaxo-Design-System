<!doctype html>
<!-- @dsCard group="Colors" name="Surfaces" subtitle="5-step dark surface scale" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Surfaces</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="swatch-row" style="gap:0;">

    </div><div class="swatch" style="background:#1c1d28; border-radius:0; flex:1; height:84px; align-items:flex-start; flex-direction:column; padding:8px; gap:2px;">

      <div style="font-size:11px; font-family:var(--font-mono); color:rgba(255,255,255,0.85); letter-spacing:0;">#1c1d28</div>
      <div style="font-size:9px; color:rgba(255,255,255,0.4); margin-top:auto; text-transform:none; letter-spacing:0;">panels</div>
    </div><div class="swatch" style="background:#232531; border-radius:0; flex:1; height:84px; align-items:flex-start; flex-direction:column; padding:8px; gap:2px;">

      <div style="font-size:9px; color:rgba(255,255,255,0.4); margin-top:auto; text-transform:none; letter-spacing:0;">sidebars</div>
    </div><div class="swatch" style="background:#2b2d42; border-radius:0; flex:1; height:84px; align-items:flex-start; flex-direction:column; padding:8px; gap:2px;">
      <div style="font-size:10px; color:rgba(255,255,255,0.5);">--bg-3</div>

    </div><div class="swatch" style="background:#424458; border-radius:0; flex:1; height:84px; align-items:flex-start; flex-direction:column; padding:8px; gap:2px;">
      <div style="font-size:10px; color:rgba(255,255,255,0.5);">--bg-5</div>
