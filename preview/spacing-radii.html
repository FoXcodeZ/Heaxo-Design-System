<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="xs → 2xl + pill" viewport="700x190" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div style="display:flex; gap:18px; align-items:flex-end; padding: 8px 0;">
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:64px; height:64px; background:var(--bg-3); border:1px solid var(--stroke-2); border-radius:2px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-2);">xs</div>
        <div style="font-family:var(--font-mono); font-size:9px; color:var(--fg-3);">2px</div>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:64px; height:64px; background:var(--bg-3); border:1px solid var(--stroke-2); border-radius:4px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-2);">sm</div>
        <div style="font-family:var(--font-mono); font-size:9px; color:var(--fg-3);">4px</div>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:64px; height:64px; background:var(--bg-3); border:1px solid var(--stroke-2); border-radius:6px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-2);">md</div>
        <div style="font-family:var(--font-mono); font-size:9px; color:var(--fg-3);">6px</div>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:64px; height:64px; background:var(--bg-3); border:1px solid var(--stroke-2); border-radius:10px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-2);">lg</div>
        <div style="font-family:var(--font-mono); font-size:9px; color:var(--fg-3);">10px</div>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:64px; height:64px; background:var(--bg-3); border:1px solid var(--stroke-2); border-radius:14px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-2);">xl</div>
        <div style="font-family:var(--font-mono); font-size:9px; color:var(--fg-3);">14px</div>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:64px; height:64px; background:var(--bg-3); border:1px solid var(--stroke-2); border-radius:20px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-2);">2xl</div>
        <div style="font-family:var(--font-mono); font-size:9px; color:var(--fg-3);">20px</div>
      </div>
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:64px; height:64px; background:var(--bg-3); border:1px solid var(--stroke-2); border-radius:999px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-2);">pill</div>
        <div style="font-family:var(--font-mono); font-size:9px; color:var(--fg-3);">pill</div>
      </div>
    
  </div>
</div></body></html>
