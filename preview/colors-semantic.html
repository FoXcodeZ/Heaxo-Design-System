<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success / warning / danger / info" viewport="700x230" -->
<html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="width:8px; height:32px; background:#4ec9b0; border-radius:2px; flex:none;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:90px;">--success-500</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#4ec9b0; width:80px;">#4ec9b0</div>
      <div style="font-family:var(--font-mono); font-size:12px; color:var(--fg-1); flex:1;">OK · Build passed</div>
    </div>
  
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="width:8px; height:32px; background:#e8b339; border-radius:2px; flex:none;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:90px;">--warning-500</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#e8b339; width:80px;">#e8b339</div>
      <div style="font-family:var(--font-mono); font-size:12px; color:var(--fg-1); flex:1;">Heads up · 3 unsaved</div>
    </div>
  
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="width:8px; height:32px; background:#e0566c; border-radius:2px; flex:none;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:90px;">--danger-500</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#e0566c; width:80px;">#e0566c</div>
      <div style="font-family:var(--font-mono); font-size:12px; color:var(--fg-1); flex:1;">Error · Compile failed</div>
    </div>
  
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="width:8px; height:32px; background:#5aa9ff; border-radius:2px; flex:none;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:90px;">--info-500</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:#5aa9ff; width:80px;">#5aa9ff</div>
      <div style="font-family:var(--font-mono); font-size:12px; color:var(--fg-1); flex:1;">Note · 12 entities updated</div>
    </div>
  
</div></body></html>
