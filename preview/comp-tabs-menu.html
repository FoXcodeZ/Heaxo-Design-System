<!doctype html>
<!-- @dsCard group="Components" name="Tabs & menu" subtitle="Underline tabs + dropdown menu" viewport="700x250" -->
<html><head><meta charset="utf-8"><title>Tabs & menu</title>
<link rel="stylesheet" href="_card.css">
</head><body><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>window.addEventListener("load",()=>lucide.createIcons());</script>
<style>
.tabs { display:flex; gap:0; border-bottom:1px solid var(--stroke-2); }
.tab { padding: 8px 14px; font-family: var(--font-sans); font-size: 13px; color: var(--fg-3); cursor:pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--fg-0); border-bottom-color: var(--plum-500); }
.menu { background: var(--bg-2); border:1px solid var(--stroke-2); border-radius: 8px; padding: 4px; width: 220px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); }
.menu-item { display:flex; align-items:center; gap:10px; padding: 7px 10px; border-radius: 4px; font-family: var(--font-sans); font-size: 13px; color: var(--fg-1); }
.menu-item.active { background: var(--plum-500); color:#fff; }
.menu-item .kbd { margin-left:auto; font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
.menu-item.active .kbd { color: rgba(255,255,255,0.7); }
.menu-sep { height:1px; background: var(--stroke-1); margin: 4px 0; }
.menu [data-lucide]{ width:14px; height:14px; opacity:0.85; }
</style>
<div class="card" style="flex-direction:row; align-items:flex-start; gap:24px;">
  <div style="flex:1;">
    <div class="tabs">
      <div class="tab active">Inspector</div>
      <div class="tab">Materials</div>
      <div class="tab">Animation</div>
      <div class="tab">Console</div>
    </div>
    <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); margin-top:14px; letter-spacing:0.05em;">TABS · 2PX PLUM UNDERLINE</div>
  </div>
  <div class="menu">
    <div class="menu-item"><i data-lucide="file-plus"></i>New scene<span class="kbd">⌘N</span></div>
    <div class="menu-item active"><i data-lucide="folder-open"></i>Open…<span class="kbd">⌘O</span></div>
    <div class="menu-item"><i data-lucide="save"></i>Save<span class="kbd">⌘S</span></div>
    <div class="menu-sep"></div>
    <div class="menu-item"><i data-lucide="settings"></i>Settings</div>
  </div>
</div></body></html>
