<!doctype html>
<!-- @dsCard group="Components" name="Viewport HUD" subtitle="FPS pill + axis gizmo" viewport="700x210" -->
<html><head><meta charset="utf-8"><title>Viewport HUD</title>
<link rel="stylesheet" href="_card.css">
</head><body><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>window.addEventListener("load",()=>lucide.createIcons());</script>
<style>
.hud-bg { background: linear-gradient(135deg, #1a1d2e 0%, #2b2d42 100%); padding: 18px; border-radius: 8px; position:relative; height: 130px; overflow:hidden; }
.hud-bg::before { content:''; position:absolute; inset:0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
.hud-pill { position:absolute; top:14px; left:14px; background: rgba(28,29,40,0.72); backdrop-filter: blur(16px); border:1px solid var(--stroke-2); border-radius: 999px; padding: 6px 14px; display:inline-flex; gap:14px; align-items:center; font-family: var(--font-mono); font-size:10px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase;}
.hud-pill .fps{color:#b6e34d;} .hud-pill .ms{color:var(--fg-2);} .hud-pill .ent{color:var(--fg-3);}
.hud-axis { position:absolute; bottom:14px; right:14px; }
</style>
<div class="card">
  <div class="hud-bg">
    <div class="hud-pill"><span class="fps">120 FPS</span><span class="ms">8.3 MS</span><span class="ent">12 ENT · 1.4 MB</span></div>
    <div class="hud-axis">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <line x1="32" y1="32" x2="56" y2="32" stroke="#e0566c" stroke-width="2"/>
        <line x1="32" y1="32" x2="32" y2="8" stroke="#b6e34d" stroke-width="2"/>
        <line x1="32" y1="32" x2="14" y2="50" stroke="#5aa9ff" stroke-width="2"/>
        <text x="58" y="35" font-size="9" font-family="JetBrains Mono" fill="#e0566c" font-weight="700">X</text>
        <text x="34" y="9" font-size="9" font-family="JetBrains Mono" fill="#b6e34d" font-weight="700">Y</text>
        <text x="6" y="56" font-size="9" font-family="JetBrains Mono" fill="#5aa9ff" font-weight="700">Z</text>
      </svg>
    </div>
  </div>
  <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); letter-spacing:0.05em;">HUD · GLASS PILL · DOT GRID · AXIS GIZMO</div>
</div></body></html>
