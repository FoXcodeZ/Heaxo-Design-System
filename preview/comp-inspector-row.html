<!doctype html>
<!-- @dsCard group="Components" name="Inspector property rows" subtitle="Transform with vec3 inputs" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Inspector property rows</title>
<link rel="stylesheet" href="_card.css">
</head><body><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>window.addEventListener("load",()=>lucide.createIcons());</script>
<style>
.insp { font-family: var(--font-sans); font-size: 12px; }
.insp-section { display:flex; align-items:center; gap:6px; padding: 8px 10px; background: var(--bg-2); border-radius: 4px; color: var(--fg-1); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px;}
.insp-section [data-lucide]{ width:13px; height:13px; }
.insp-row { display:flex; align-items:center; gap:10px; padding: 4px 4px; }
.insp-row .lab { width: 90px; color: var(--fg-3); font-size:11px; }
.numeric { display:inline-flex; background: var(--bg-2); border:1px solid var(--stroke-1); border-radius:4px; overflow:hidden; }
.nl { font-family: var(--font-mono); font-size:10px; padding: 4px 6px; font-weight:700; }
.nl.x{color:#e0566c; background:rgba(224,86,108,0.1);} .nl.y{color:#b6e34d; background:rgba(182,227,77,0.1);} .nl.z{color:#5aa9ff; background:rgba(90,169,255,0.1);}
.numeric input { background:transparent; border:none; outline:none; color:var(--fg-1); font-family:var(--font-mono); font-size:11px; padding:4px 8px; width:54px; }
</style>
<div class="card">
  <div class="insp-section"><i data-lucide="move-3d"></i>Transform</div>
  <div class="insp-row"><span class="lab">Position</span>
    <div class="numeric"><span class="nl x">X</span><input value="12.480"></div>
    <div class="numeric"><span class="nl y">Y</span><input value="0.000"></div>
    <div class="numeric"><span class="nl z">Z</span><input value="-4.250"></div>
  </div>
  <div class="insp-row"><span class="lab">Rotation</span>
    <div class="numeric"><span class="nl x">X</span><input value="0.0"></div>
    <div class="numeric"><span class="nl y">Y</span><input value="45.0"></div>
    <div class="numeric"><span class="nl z">Z</span><input value="0.0"></div>
  </div>
  <div class="insp-row"><span class="lab">Scale</span>
    <div class="numeric"><span class="nl x">X</span><input value="1.000"></div>
    <div class="numeric"><span class="nl y">Y</span><input value="1.000"></div>
    <div class="numeric"><span class="nl z">Z</span><input value="1.000"></div>
  </div>
</div></body></html>
