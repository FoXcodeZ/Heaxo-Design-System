<!doctype html>
<!-- @dsCard group="Spacing" name="Borders & strokes" subtitle="Hairline → focus ring" viewport="700x230" -->
<html><head><meta charset="utf-8"><title>Borders & strokes</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:120px; height:36px; background:var(--bg-2); border:1px solid rgba(255,255,255,0.06); border-radius:6px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:120px;">--stroke-1</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); flex:1;">rgba(255,255,255,0.06)</div>
      <div style="font-size:11px; color:var(--fg-2);">hairline</div>
    </div>
  
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:120px; height:36px; background:var(--bg-2); border:1px solid rgba(255,255,255,0.10); border-radius:6px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:120px;">--stroke-2</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); flex:1;">rgba(255,255,255,0.10)</div>
      <div style="font-size:11px; color:var(--fg-2);">default</div>
    </div>
  
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:120px; height:36px; background:var(--bg-2); border:1px solid rgba(255,255,255,0.18); border-radius:6px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:120px;">--stroke-3</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); flex:1;">rgba(255,255,255,0.18)</div>
      <div style="font-size:11px; color:var(--fg-2);">emphasis</div>
    </div>
  
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:120px; height:36px; background:var(--bg-2); border:1px solid #a53273; border-radius:6px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-3); width:120px;">--stroke-focus</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg-3); flex:1;">#a53273</div>
      <div style="font-size:11px; color:var(--fg-2);">focus ring</div>
    </div>
  
</div></body></html>
